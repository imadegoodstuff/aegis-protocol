name: build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  evm:
    name: EVM (Foundry)
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: evm } }
    steps:
      - uses: actions/checkout@v4
      - uses: foundry-rs/foundry-toolchain@v1
        with: { version: stable }
      - run: forge --version
      - run: forge install OpenZeppelin/openzeppelin-contracts foundry-rs/forge-std --no-commit || true
      - run: forge build --sizes
      - run: forge test -vv

  model:
    name: CCHS state machine (bounded model check)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: node model/cchs-state.mjs
      - name: known verifier bugs must be caught
        run: |
          for m in no-index-check cache-without-epoch idx-not-in-digest top-layer-not-bound; do
            if node model/cchs-state.mjs --mutant=$m; then echo "mutant $m not caught"; exit 1; fi
          done
      - run: node model/cchs-client.mjs
      - name: known client-rule violations must be caught
        run: |
          for m in record-after-sign restore-then-wait no-partition no-record recovery-random-roots; do
            if node model/cchs-client.mjs --mutant=$m; then echo "mutant $m not caught"; exit 1; fi
          done

  core:
    name: Core (Rust)
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: core } }
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --release
      - run: cargo test --lib

  cchs-core:
    name: CCHS core (Rust, fixture vectors)
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: cchs-core } }
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --release --no-default-features
      - run: cargo test -p cchs-core --features std

  wallet:
    name: Wallet UI (Vite)
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: wallet } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - run: npm ci || npm install
      - run: npm run build
      - name: derivation and signature vectors
        run: npm run vectors
      - name: client index discipline
        run: npm run index-discipline
      - name: full account life cycle in an EVM (create, sign, skip, rotate, withdraw) with costs
        run: npm run evm-flow

  cosmwasm:
    name: CosmWasm (Rust wasm32)
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: cosmwasm } }
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with: { targets: wasm32-unknown-unknown }
      - run: cargo build --release --target wasm32-unknown-unknown --lib

  near:
    name: NEAR (Rust wasm32)
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: near } }
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with: { targets: wasm32-unknown-unknown }
      - run: cargo build --release --target wasm32-unknown-unknown --lib

  aptos:
    name: Aptos (Move)
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: aptos } }
    steps:
      - uses: actions/checkout@v4
      - name: Install aptos CLI
        run: |
          curl -fsSL "https://aptos.dev/scripts/install_cli.sh" | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - run: aptos --version
      - run: aptos move compile --named-addresses aegis=0x1
      - run: aptos move test --named-addresses aegis=0x1

  sui:
    name: Sui (Move)
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: sui } }
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - name: Install sui CLI (latest mainnet release binary)
        run: |
          set -euo pipefail
          TAG=$(gh api 'repos/MystenLabs/sui/releases?per_page=40' \
                --jq '[.[] | select(.prerelease == false) | select(.tag_name | startswith("mainnet-v"))][0].tag_name')
          echo "Using sui release $TAG"
          gh release download "$TAG" -R MystenLabs/sui -p "sui-${TAG}-ubuntu-x86_64.tgz" -O sui.tgz
          mkdir -p "$HOME/sui-bin" && tar -xzf sui.tgz -C "$HOME/sui-bin"
          SUI_BIN=$(find "$HOME/sui-bin" -type f -name 'sui' | head -n 1)
          chmod +x "$SUI_BIN"
          echo "$(dirname "$SUI_BIN")" >> "$GITHUB_PATH"
      - run: sui --version
      - run: sui move build
      # --gas-limit bounds instructions per test (default is tight for the end-to-end tests);
      # the Sui computation cap still applies, which is why tree roots are precomputed
      - run: sui move test --gas-limit 100000000000

  cairo:
    name: Starknet (Cairo, Scarb 2.8.5)
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: cairo } }
    steps:
      - uses: actions/checkout@v4
      - uses: software-mansion/setup-scarb@v1
        with: { scarb-version: "2.8.5" }
      - run: scarb --version
      - run: scarb build
      - run: scarb test

  ton:
    name: TON (FunC via func-js + sandbox)
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: ton } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - run: npm install
      - run: npm run build
      - run: npm test

  # Host-side type check of the Anchor program (anchor-lang compiles natively),
  # then the SBF build with the Anza platform tools. anchor-cli is not needed
  # for the build itself; the IDL is produced at release time.
  solana:
    name: Solana (CCHS-C-20 program, SBF)
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: solana } }
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: solana }
      - run: cargo check -p aegis_account --features no-entrypoint
      - name: Install Anza toolchain
        run: |
          sh -c "$(curl -sSfL https://release.anza.xyz/stable/install)"
          echo "$HOME/.local/share/solana/install/active_release/bin" >> "$GITHUB_PATH"
      - run: cargo build-sbf --manifest-path programs/aegis_account/Cargo.toml
      - run: ls -l target/deploy/aegis_account.so

  tron:
    name: TRON (TVM build, opcode scan, predictor self-test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - run: npm ci
        working-directory: deploy
      - run: node predict.mjs --self-test
        working-directory: tron
      - run: node build.mjs
        working-directory: tron
      - name: TVM init code must equal the EVM artifact
        run: node -e "const a=require('./tron/artifacts/cchs-tvm.json'); if(a.identicalToEvmArtifact!==true){console.error('init code differs from wallet/src/aegis/cchsArtifacts.json');process.exit(1)}"
