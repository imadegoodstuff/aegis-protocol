name: audit

# Static analysis of the EVM contracts with tools that are not in the build
# matrix. Run by hand; the report is uploaded as an artifact and the findings
# are read and recorded in SECURITY.md §3.1. None of this is an audit.

on:
  workflow_dispatch:

jobs:
  aderyn:
    name: Aderyn 0.6.8 (Cyfrin, Rust AST analyzer)
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: evm } }
    steps:
      - uses: actions/checkout@v4
      - uses: foundry-rs/foundry-toolchain@v1
        with: { version: stable }
      - run: forge install OpenZeppelin/openzeppelin-contracts foundry-rs/forge-std --no-commit || true
      - name: Install Aderyn (pinned release, checksum verified)
        run: |
          curl -sSL -o aderyn.tar.xz https://github.com/Cyfrin/aderyn/releases/download/aderyn-v0.6.8/aderyn-x86_64-unknown-linux-gnu.tar.xz
          echo "ffd6ca658962e211a3ac821c646f69c8e14bf1b1001cbfe091bcd4535a691e46  aderyn.tar.xz" | sha256sum -c
          tar -xJf aderyn.tar.xz
          echo "$PWD/aderyn-x86_64-unknown-linux-gnu" >> "$GITHUB_PATH"
      - run: aderyn --version
      - name: Analyze evm/src (tests and scripts excluded)
        run: aderyn . --src src/ -o aderyn-report.md
      - name: Summary
        run: |
          { echo '## Aderyn report'; cat aderyn-report.md; } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: aderyn-report-${{ github.sha }}
          path: evm/aderyn-report.md
          if-no-files-found: error

  mythril:
    name: Mythril (ConsenSys, symbolic execution over the CCHS contracts)
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: evm } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - run: pip install mythril
      - run: myth version
      # Same compiler settings as foundry.toml (via-ir, 0.8.28); Mythril reads
      # them from a solc standard-json "settings" object.
      - name: Compiler settings
        run: |
          cat > solc.json <<'EOF'
          {
            "optimizer": { "enabled": true, "runs": 1000000 },
            "viaIR": true,
            "evmVersion": "cancun",
            "outputSelection": { "*": { "*": ["*"], "": ["*"] } }
          }
          EOF
      - name: Analyze the CCHS account contracts and factory
        run: |
          set -o pipefail
          : > mythril-report.md
          for f in src/AegisCCHS.sol src/AegisCCHSK.sol src/AegisCCHSFactory.sol src/UpgradeHelper.sol; do
            echo "## $f" >> mythril-report.md
            myth analyze "$f" --solv 0.8.28 --solc-json solc.json --execution-timeout 900 --max-depth 64 -o markdown \
              | tee -a mythril-report.md || true
            echo >> mythril-report.md
          done
      - name: Summary
        run: |
          { echo '## Mythril report'; cat mythril-report.md; } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: mythril-report-${{ github.sha }}
          path: evm/mythril-report.md
          if-no-files-found: error
