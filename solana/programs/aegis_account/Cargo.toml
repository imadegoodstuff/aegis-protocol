[package]
name = "aegis_account"
version = "0.2.0"
edition = "2021"
description = "Aegis CCHS-C-20 post-quantum smart account for Solana (SVM): single-packet hash-based signatures"

[lib]
crate-type = ["cdylib", "lib"]
name = "aegis_account"

[features]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
cpi = ["no-entrypoint"]
idl-build = ["anchor-lang/idl-build"]
custom-heap = []
custom-panic = []
anchor-debug = []
default = []

[dependencies]
anchor-lang = { version = "0.31.1", features = ["init-if-needed"] }
cchs-core   = { path = "../../../cchs-core", default-features = false }

[dev-dependencies]
# Host-side replay of evm/test/fixtures/cchs-c-20.json (`cargo test`).
serde_json = "1"
# tests/compute_units.rs: runs the built SBF program (target/deploy/aegis_account.so)
# in the BanksClient runtime and reports compute units per instruction. The
# runtime must be able to load the ELF that `cargo build-sbf` produces, so it
# is kept on the same Agave line as the toolchain CI installs (v2.3.6) and as
# anchor-lang 0.31 resolves solana-program to.
solana-program-test = "=2.3.6"
solana-sdk = "2.3"
bincode = "1"
# Re-signs the fixture ops over the on-chain digest (HKDF-SHA256 key derivation
# with the fixture's master seed, see the test header).
sha2 = "0.10"
hmac = "0.12.1"
