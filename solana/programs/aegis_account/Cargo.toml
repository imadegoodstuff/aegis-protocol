[package]
name = "aegis_account"
version = "0.2.0"
edition = "2021"
# The rustc inside the Agave 2.3 platform tools. ../../Cargo.lock is committed
# and holds every dependency at a version that toolchain can read; refresh it
# with CARGO_RESOLVER_INCOMPATIBLE_RUST_VERSIONS=fallback (see the CI job).
rust-version = "1.84.0"
description = "Aegis CCHS-C-20 post-quantum smart account for Solana (SVM): single-packet hash-based signatures"

[lib]
crate-type = ["cdylib", "lib"]
name = "aegis_account"

[features]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
cpi = ["no-entrypoint"]
idl-build = ["anchor-lang/idl-build"]
custom-heap = []
custom-panic = []
anchor-debug = []
default = []

[dependencies]
anchor-lang = { version = "0.31.1", features = ["init-if-needed"] }
cchs-core   = { path = "../../../cchs-core", default-features = false }

[dev-dependencies]
# Host-side replay of evm/test/fixtures/cchs-c-20.json (`cargo test --lib`).
# The compute-unit measurement against the SBF build lives in ../../cu-test,
# a separate package, so that solana-program-test never enters this lock file.
serde_json = "1"
