[package]
name = "aegis_account"
version = "0.2.0"
edition = "2021"
description = "Aegis CCHS-S-20 post-quantum smart account for Solana (SVM)"

[lib]
crate-type = ["cdylib", "lib"]
name = "aegis_account"

[features]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
cpi = ["no-entrypoint"]
idl-build = ["anchor-lang/idl-build"]
default = []

[dependencies]
anchor-lang = { version = "0.30.1", features = ["init-if-needed"] }
cchs-core   = { path = "../../../cchs-core", default-features = false }
