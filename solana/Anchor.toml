[toolchain]
anchor_version = "0.31.1"
solana_version = "2.3.6"

[features]
seeds = false
skip-lint = false

# One program id on every cluster: the keypair that owns it is kept off the
# repository; devnet holds the deployed program, mainnet-beta does not yet.
[programs.localnet]
aegis_account = "AoQ7c3GuxiF7nshFnM872FoxUz7oUDhygdhoRX6jMQKr"

[programs.devnet]
aegis_account = "AoQ7c3GuxiF7nshFnM872FoxUz7oUDhygdhoRX6jMQKr"

[registry]
url = "https://api.apr.dev"

[provider]
cluster = "Localnet"
wallet  = "~/.config/solana/id.json"

[scripts]
test = "yarn run ts-mocha -p ./tsconfig.json -t 1000000 tests/**/*.ts"

[workspace]
members = ["programs/aegis_account"]
