[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc = "0.8.28"
optimizer = true
optimizer_runs = 1_000_000
via_ir = true
evm_version = "cancun"
bytecode_hash = "none"      # 关键: 相同源码在所有链产生相同 bytecode -> CREATE2 同地址
cbor_metadata = false
remappings = [
    "@openzeppelin/=lib/openzeppelin-contracts/",
    "forge-std/=lib/forge-std/src/",
]
fs_permissions = [{ access = "read-write", path = "./" }]

[profile.ci]
verbosity = 4
fuzz = { runs = 1000 }

[rpc_endpoints]
ethereum  = "${RPC_ETHEREUM}"
bsc       = "${RPC_BSC}"
polygon   = "${RPC_POLYGON}"
arbitrum  = "${RPC_ARBITRUM}"
optimism  = "${RPC_OPTIMISM}"
base      = "${RPC_BASE}"
avalanche = "${RPC_AVALANCHE}"
linea     = "${RPC_LINEA}"
scroll    = "${RPC_SCROLL}"
mantle    = "${RPC_MANTLE}"
blast     = "${RPC_BLAST}"
mode      = "${RPC_MODE}"
sepolia   = "${RPC_SEPOLIA}"

[etherscan]
# verify.sh 读取
