app = "aegis-wallet"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "8080"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"      # no suspend; keep warm, no cold starts
  auto_start_machines = true
  min_machines_running = 1        # always at least 1 up

  [http_service.concurrency]
    type = "requests"
    hard_limit = 500
    soft_limit = 400

  [[http_service.checks]]
    grace_period = "10s"
    interval = "30s"
    method = "GET"
    timeout = "5s"
    path = "/"

[[vm]]
  size = "performance-1x"         # dedicated CPU, 2 GB RAM
  memory = "2gb"
