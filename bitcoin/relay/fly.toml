# Example deployment: `fly launch --copy-config --no-deploy && fly volumes create btcdata --size 3 && fly deploy`
# First start syncs signet (hours). /info reports initialblockdownload until it is done.
app = "aegis-btc-relay"
primary_region = "ams"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "8080"
  ALLOW_ORIGIN = "*"

[[mounts]]
  source = "btcdata"
  destination = "/data"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

[[vm]]
  size = "shared-cpu-2x"
  memory = "2gb"
