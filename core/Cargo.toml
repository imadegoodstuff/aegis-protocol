[package]
name = "aegis-core"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Chain-agnostic BIP-39 -> SPHINCS+ derivation and signing for the Aegis protocol"

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = ["std"]
std = []
wasm = ["wasm-bindgen", "getrandom/js"]

[dependencies]
# v0.1 uses a stub for SPHINCS+ matching evm/src/SphincsVerifierStub.sol so the
# whole pipeline can be driven in tests. v0.2 will depend on a real FIPS 205
# SLH-DSA crate (candidate: `fips205`, or custom native via ethrex/leanSig).

# Deterministic derivation
bip39     = { version = "2", default-features = false }
hkdf      = { version = "0.12", default-features = false }
sha2      = { version = "0.10", default-features = false }
sha3      = { version = "0.10", default-features = false }
zeroize   = { version = "1", features = ["derive"] }
getrandom = { version = "0.2", default-features = false }

# ECDSA fallback (secp256k1)
k256 = { version = "0.13", default-features = false, features = ["ecdsa", "sha256"] }

# Optional WASM bindings
wasm-bindgen = { version = "0.2", optional = true }
